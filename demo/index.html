<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ol-elevation-profile — démo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <link rel="stylesheet" href="../dist/ol-elevation-profile.css">
  <script src="../dist/ol-elevation-profile.js"></script>

  <style>
    :root { --ink:#15202b; --panel:#fbfaf7; --rule:#e4e0d6; --accent:#c4541a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color: var(--ink); }
    #map { position: absolute; inset: 0; }
    .ol-zoom { top: .6em; left: .6em; }

    /* Elevation alert */
    #alert {
      position: absolute; top: 0; left: 0; right: 0; z-index: 30; display: none;
      background: rgba(255, 214, 0, 0.85); color: #3a2e00; border-bottom: 1px solid rgba(0,0,0,.15);
      padding: 9px 40px 9px 14px; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    #alert .x { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; cursor: pointer;
      font-size: 18px; line-height: 1; color: #3a2e00; opacity: .7; padding: 4px; }
    #alert .x:hover { opacity: 1; }

    header {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
      padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); max-width: min(270px, calc(100vw - 24px));
    }
    header h1 { margin: 0; font: 600 15px/1.2 ui-monospace, monospace; letter-spacing: -.3px; }
    header h1 b { color: var(--accent); }
    header p { margin: 4px 0 0; font-size: 11px; opacity: .7; }

    #gear {
      position: absolute; top: 12px; right: 12px; z-index: 21; width: 38px; height: 38px;
      border: 1px solid var(--rule); background: var(--panel); border-radius: 10px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,.12); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
    }
    #panel {
      position: absolute; top: 56px; right: 12px; z-index: 20; width: 380px;
      background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 10px 12px;
      font: 12px/1.4 ui-monospace, monospace; max-height: calc(100% - 70px); overflow: auto;
    }
    #panel.hidden { display: none; }
    #panel h2 { margin: 10px 0 6px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
    #panel h2:first-child { margin-top: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
    .row label { opacity: .8; }
    .row select, .row input[type=range] { width: 124px; }
    .row select.dem { width: 160px; }
    .row input[type=range] { accent-color: var(--accent); }
    .row input[type=color] { width: 32px; height: 22px; padding: 0; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
    .val { opacity: .55; font-size: 11px; min-width: 38px; text-align: right; }
    .seg { display: flex; gap: 4px; margin: 5px 0; flex-wrap: wrap; }
    .seg button { flex: 1 0 auto; border: 1px solid var(--rule); background: #fff; border-radius: 6px; padding: 4px 6px;
      font: 11px ui-monospace, monospace; cursor: pointer; }
    .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chk { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 4px 0; }
    .chk label { display: inline-flex; align-items: center; gap: 4px; opacity: .85; cursor: pointer; }
    .mini { border: 1px solid var(--rule); background: #fff; border-radius: 6px; padding: 3px 7px;
      font: 11px ui-monospace, monospace; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="alert"><span id="alert-msg"></span><button class="x" id="alert-x" title="Fermer">×</button></div>

  <header>
    <h1>ol-<b>elevation</b>-profile</h1>
    <p>Click a track · hover the map or the chart · click empty space to hide.</p>
  </header>

    <button id="gear" title="Menu réglages" aria-label="Menu réglages">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="panel">
    <h2>Track</h2>
    <div class="seg" id="tracks"></div>
    <div class="chk"><label>Import a file (GeoJSON / GPX / KML)
      <input type="file" id="importFile" accept=".geojson,.json,.gpx,.kml,.xml" style="display:block;margin-top:4px">
    </label></div>

    <h2>Layout</h2>
    <div class="row"><label>position</label>
      <select id="position">
        <option>bottom</option><option>top</option><option>left</option><option>right</option>
        <option>top-left</option><option>top-right</option><option>bottom-left</option><option>bottom-right</option>
      </select></div>
    <div class="row"><label>width</label>
      <input type="range" id="width" min="280" max="900" value="520"><span class="val" id="width_v">520</span></div>
    <div class="seg"><button class="mini" id="widthAuto">width = map (auto)</button></div>
    <div class="row"><label>height</label>
      <input type="range" id="height" min="100" max="300" value="180"><span class="val" id="height_v">180</span></div>

    <h2>Appearance</h2>
    <div class="row"><label>theme</label>
      <select id="theme">
        <option>steelblue</option><option>lime</option><option>purple</option>
        <option>slate</option><option>graphite</option><option>amber</option>
      </select></div>
    <div class="row"><label>color</label>
      <span><input type="color" id="color" value="#c4541a">
        <button class="mini" id="colorTrace">track</button>
        <button class="mini" id="colorReset">theme</button></span></div>
    <div class="row"><label>background opacity</label>
      <input type="range" id="opacity" min="0" max="100" value="100"><span class="val" id="opacity_v">100%</span></div>
    <div class="row"><label>xTicks</label>
      <input type="range" id="xTicks" min="2" max="14" value="6"><span class="val" id="xTicks_v">auto</span></div>
    <div class="row"><label>yTicks</label>
      <input type="range" id="yTicks" min="2" max="10" value="4"><span class="val" id="yTicks_v">auto</span></div>
    <div class="seg">
      <button data-flag="grid" class="on">grid</button>
      <button data-flag="collapsable" class="on">collapsable</button>
      <button data-flag="zoom">zoom A↔B</button>
      <button data-flag="exportPng">export PNG</button>
    </div>

    <h2>Profile</h2>
    <div class="row"><label>smoothing (m)</label>
      <input type="range" id="smoothing" min="0" max="300" step="10" value="0"><span class="val" id="smoothing_v">off</span></div>
    <div class="row"><label>DEM (no Z)</label>
      <select id="dem" class="dem">
        <option value="terrarium">terrarium (AWS, world)</option>
        <option value="ign">ign (RGE ALTI, France)</option>
        <option value="custom">custom function</option>
        <option value="off">off</option>
      </select></div>

    <h2>Slope</h2>
    <div class="seg"><button data-flag="slope">enable slope</button></div>
    <div class="row"><label>class size</label>
      <input type="range" id="slopeClassSize" min="1" max="5" step="0.5" value="2.5"><span class="val" id="slopeClassSize_v">2.5%</span></div>

    <h2>Units &amp; selection</h2>
    <div class="row"><label>units</label>
      <select id="units"><option value="meters">meters</option><option value="imperial">imperial</option></select></div>
    <div class="row"><label>show</label>
      <select id="show"><option>click</option><option>mouseover</option></select></div>

    <h2>Tooltip</h2>
    <div class="chk" id="tooltipItems">
      <label><input type="checkbox" value="distance" checked> distance</label>
      <label><input type="checkbox" value="elevation" checked> elevation</label>
      <label><input type="checkbox" value="slope"> slope</label>
      <label><input type="checkbox" value="time"> elapsed time</label>
    </div>

    <h2>Header</h2>
    <div class="chk" id="headerItems">
      <label><input type="checkbox" value="distance" checked> distance</label>
      <label><input type="checkbox" value="ascent" checked> D+</label>
      <label><input type="checkbox" value="descent" checked> D-</label>
      <label><input type="checkbox" value="minmax" checked> min–max</label>
      <label><input type="checkbox" value="duration"> total duration</label>
    </div>
    <div class="chk"><label><input type="checkbox" id="titleLink"> link on the title (&laquo;&nbsp;link&nbsp;&raquo; property)</label></div>
  </div>

  <script>
  (() => {
    const Profile = window.OlElevationProfile;
    const isMobile = () => window.innerWidth <= 640;

    const base = new ol.layer.Tile({ source: new ol.source.OSM() });
    const vectorSource = new ol.source.Vector();
    const vectorLayer = new ol.layer.Vector({
      source: vectorSource,
      style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#c4541a', width: 3 }) })
    });
    const map = new ol.Map({
      target: 'map', layers: [base, vectorLayer],
      view: new ol.View({ center: ol.proj.fromLonLat([2.5, 44]), zoom: 6 })
    });

    const profile = new Profile({
      theme: 'steelblue', position: 'bottom', units: 'meters', show: 'click',
      width: 520, height: 180, slope: false, slopeClassSize: 2.5, zoom: false,
      grid: true, collapsable: true, responsive: true,
      color: 'auto', trackLayer: vectorLayer,
      tooltipItems: ['distance', 'elevation'],
      headerItems: ['distance', 'ascent', 'descent', 'minmax']
    });
    map.addControl(profile);

    const format = new ol.format.GeoJSON();
    const TRACKS = window.DEMO_TRACKS || [
      { id: 'gorgesAveyron', label: 'Gorges Aveyron' },
      { id: 'dunRevel',      label: 'Dunkerque–Revel' },
      { id: 'girAya',        label: 'Girona–Ayamonte' },
      { id: 'noZ_demo',      label: 'No elevation' }
    ];
    const getGeo = (id) => (window.TRACK_DATA && window.TRACK_DATA[id])
      ? Promise.resolve(window.TRACK_DATA[id])
      : fetch(`data/${id}.geojson`).then((r) => r.json());

    const readFeats = (gj) => format.readFeatures(gj, {
      dataProjection: 'EPSG:4326', featureProjection: map.getView().getProjection()
    });

    let currentLabel = null;
    const loadTrack = (id) => getGeo(id).then((gj) => {
      const t = TRACKS.find((x) => x.id === id); currentLabel = t ? t.label : null;
      vectorSource.clear();
      const feats = readFeats(gj);
      vectorSource.addFeatures(feats);
      profile.setFeature(feats[0]);
      map.getView().fit(feats[0].getGeometry().getExtent(), { padding: [70, 60, 230, 280], duration: 400 });
    });

    // --- Shared alert : elevation (Z) and missing time ---
    let infoCache = [], importedInfo = null;
    const phrase = (labels, lack) => {
      const pl = labels.length > 1;
      return `${pl ? 'Les tracés' : 'Le tracé'} « ${labels.join(' », « ')} » ${pl ? "n'ont" : "n'a"} pas ${lack}.`;
    };
    const timeActive = () => {
      const tt = document.querySelector('#tooltipItems input[value=time]');
      const hd = document.querySelector('#headerItems input[value=duration]');
      return (tt && tt.checked) || (hd && hd.checked);
    };
    const demActive = () => document.getElementById('dem').value !== 'off';
    const updateAlert = () => {
      const all = infoCache.concat(importedInfo ? [importedInfo] : []);
      // Avec le MNT actif, l'absence de Z dans le fichier n'est plus un manque : elle est
      // comblée. On n'annonce donc que les tracés dont le remplissage a ÉCHOUÉ (demFailed),
      // et non tous ceux qui n'ont pas de Z d'origine — un tracé pas encore affiché n'a
      // même pas été tenté.
      const noZ = all.filter((x) => !x.hasZ && !demActive()).map((x) => x.label);
      const failed = demActive() ? all.filter((x) => x.demFailed).map((x) => x.label) : [];
      const noT = timeActive() ? all.filter((x) => !x.hasTime).map((x) => x.label) : [];
      const parts = [];
      if (noZ.length) parts.push(phrase(noZ, "d'altimétrie"));
      if (failed.length) parts.push(phrase(failed, "d'altimétrie, et le modèle de terrain n'a pas pu la fournir"));
      if (noT.length) parts.push(phrase(noT, "de temps"));
      const box = document.getElementById('alert'), msg = document.getElementById('alert-msg');
      if (parts.length) { msg.innerHTML = parts.join('<br>'); box.style.display = 'block'; }
      else box.style.display = 'none';
    };

    // --- File imports : GeoJSON / GPX / KML (the library only use Ol.Feature) ---
    const lineCount = (ft) => { const g = ft.getGeometry(); const t = g && g.getType();
      if (t === 'LineString') return g.getCoordinates().length;
      if (t === 'MultiLineString') return g.getCoordinates().reduce((n, seg) => n + seg.length, 0);
      return 0; };
    const pickLine = (feats) => feats.filter(lineCount).sort((a, b) => lineCount(b) - lineCount(a))[0] || null;
    const readByFormat = (text, fname) => {
      const ext = (fname.split('.').pop() || '').toLowerCase();
      let fmt;
      if (ext === 'kml') fmt = new ol.format.KML({ extractStyles: false });
      else if (ext === 'gpx') fmt = new ol.format.GPX();
      else if (ext === 'geojson' || ext === 'json') fmt = new ol.format.GeoJSON();
      else if (/<gpx[\s>]/i.test(text)) fmt = new ol.format.GPX();
      else if (/<kml[\s>]/i.test(text)) fmt = new ol.format.KML({ extractStyles: false });
      else fmt = new ol.format.GeoJSON();
      const opts = { featureProjection: map.getView().getProjection() };
      const isGeo = fmt instanceof ol.format.GeoJSON;
      if (isGeo) opts.dataProjection = 'EPSG:4326';
      return fmt.readFeatures(isGeo ? JSON.parse(text) : text, opts);
    };
    const importEl = document.getElementById('importFile');
    if (importEl) importEl.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const f = pickLine(readByFormat(String(reader.result), file.name));
          if (!f) { alert('Aucune ligne (LineString) trouvée dans le fichier.'); return; }
          vectorSource.clear(); vectorSource.addFeatures([f]);
          profile.setFeature(f);
          map.getView().fit(f.getGeometry().getExtent(), { padding: [70, 60, 230, 280], duration: 400 });
          importedInfo = { label: file.name, hasZ: Profile.featureHasZ(f), hasTime: Profile.featureHasTime(f) };
          updateAlert();
        } catch (err) { alert('Import impossible : ' + err.message); }
      };
      reader.readAsText(file);
    });

    // --- Track scanning : Z + times, then alert ---
    Promise.all(TRACKS.map((t) => getGeo(t.id).then((gj) => {
      const f = readFeats(gj)[0];
      return { label: t.label, hasZ: Profile.featureHasZ(f), hasTime: Profile.featureHasTime(f) };
    }).catch(() => null))).then((res) => { infoCache = res.filter(Boolean); updateAlert(); });
    document.getElementById('alert-x').onclick = () => { document.getElementById('alert').style.display = 'none'; };

    // --- Track selector ---
    const tracksEl = document.getElementById('tracks');
    TRACKS.forEach((t, i) => {
      const b = document.createElement('button');
      b.textContent = t.label;
      if (i === 0) b.className = 'on';
      b.onclick = () => { [...tracksEl.children].forEach((c) => c.classList.remove('on')); b.classList.add('on'); loadTrack(t.id); };
      tracksEl.appendChild(b);
    });
    loadTrack(TRACKS[0].id);

    // --- Controls ---
    const bindSelect = (id, key) => { document.getElementById(id).onchange = function () { profile.setOptions({ [key]: this.value }); }; };
    bindSelect('theme', 'theme'); bindSelect('position', 'position'); bindSelect('units', 'units'); bindSelect('show', 'show');

    const bindRange = (id, key, fmt) => {
      const el = document.getElementById(id), out = document.getElementById(`${id}_v`);
      el.oninput = function () { const v = +this.value; out.textContent = fmt ? fmt(v) : v; profile.setOptions({ [key]: v }); };
    };
    bindRange('width', 'width'); bindRange('height', 'height');
    bindRange('xTicks', 'xTicks'); bindRange('yTicks', 'yTicks');
    bindRange('slopeClassSize', 'slopeClassSize', (v) => `${v}%`);
    bindRange('smoothing', 'smoothing', (v) => v === 0 ? 'off' : `${v} m`);

    // DEM: only applies to tracks without elevation. The alert follows the outcome -
    // filled means nothing is missing any more, failed is the only case worth reporting.
    //
    // 'custom' stands in for what a GeoServer WCS, a GeoTIFF or an in-house API would do:
    // the application answers with the elevations itself. Here it fakes a gentle hill, so
    // the hook is visible without a server to point at.
    const DEM_SOURCES = {
      terrarium: 'terrarium',
      ign: 'ign',
      custom: (lonlats) => lonlats.map((_, i) => 200 + 400 * Math.sin(Math.PI * i / lonlats.length)),
      off: null
    };
    document.getElementById('dem').onchange = function () {
      // setOptions clears the cached Z, so the track on screen is re-filled at once.
      profile.setOptions({ dem: DEM_SOURCES[this.value] });
      updateAlert();                       // switching it changes what counts as missing
    };
    profile.on('demload', (e) => {
      const cur = infoCache.find((x) => x.label === currentLabel) || importedInfo;
      if (!cur) return;
      if (e.ok) { cur.hasZ = true; cur.demFailed = false; } else { cur.demFailed = true; }
      updateAlert();
    });

    // Width: limit slider at map width + "auto" button (= map width)
    const widthEl = document.getElementById('width'), widthV = document.getElementById('width_v');
    const syncWidthMax = () => {
      const mw = Math.round(map.getTargetElement().clientWidth);
      widthEl.max = mw;
      if (+widthEl.value > mw) { widthEl.value = mw; widthV.textContent = mw; profile.setOptions({ width: mw }); }
    };
    window.addEventListener('resize', syncWidthMax);
    requestAnimationFrame(syncWidthMax);
    document.getElementById('widthAuto').onclick = () => {
      profile.setOptions({ width: 'auto' });
      const mw = Math.round(map.getTargetElement().clientWidth);
      widthEl.value = mw; widthV.textContent = `${mw} (auto)`;
    };

    document.getElementById('color').oninput = function () { profile.setColor(this.value); };
    document.getElementById('colorTrace').onclick = () => profile.setOptions({ color: 'auto' });
    document.getElementById('colorReset').onclick = () => profile.setColor(null);

    const op = document.getElementById('opacity'), opv = document.getElementById('opacity_v');
    op.oninput = function () { const v = +this.value; opv.textContent = `${v}%`; profile.setOptions({ transparency: v >= 100 ? false : v / 100 }); };

    document.querySelectorAll('[data-flag]').forEach((btn) => {
      btn.onclick = () => { const on = !btn.classList.contains('on'); btn.classList.toggle('on', on); profile.setOptions({ [btn.dataset.flag]: on }); };
    });

    const bindChecks = (containerId, key) => {
      const box = document.getElementById(containerId);
      box.addEventListener('change', () => {
        const arr = [...box.querySelectorAll('input')].filter((i) => i.checked).map((i) => i.value);
        profile.setOptions({ [key]: arr });
        updateAlert();
      });
    };
    bindChecks('tooltipItems', 'tooltipItems');
    bindChecks('headerItems', 'headerItems');
    document.getElementById('titleLink').onchange = function () { profile.setOptions({ titleLink: this.checked ? 'link' : null }); };

    // --- Settings panel (hideable, folded by default on mobile devices) ---
    const panel = document.getElementById('panel');
    if (isMobile()) panel.classList.add('hidden');
    document.getElementById('gear').onclick = () => panel.classList.toggle('hidden');
  })();
  </script>
</body>
</html>
